<!-- HTML for capturing or uploading an image -->
<div class="upload-container">
  <h2>Chess Board Image Processor</h2>
  
  <div class="file-input-section">
    <label for="uploadInput">Select Chess Board Image:</label>
    <input type="file" id="uploadInput" (change)="onFileSelected($event)" accept="image/*">
  </div>
  
  <div class="upload-section">
    <button 
      (click)="uploadImage()" 
      [disabled]="!selectedFile || isProcessing"
      class="upload-btn">
      <span *ngIf="!isProcessing">🚀 Process Image</span>
      <span *ngIf="isProcessing">⏳ Processing...</span>
    </button>
  </div>

  <!-- Display selected file info -->
  <div *ngIf="selectedFile" class="file-info">
    <p><strong>Selected file:</strong> {{ selectedFile.name }}</p>
    <p><strong>Size:</strong> {{ (selectedFile.size / 1024 / 1024).toFixed(2) }} MB</p>
  </div>

  <!-- Processing indicator -->
  <div *ngIf="isProcessing" class="processing">
    <p>🔄 Processing your chess board image...</p>
    <p>This may take a few moments.</p>
  </div>

  <!-- Display chess URL result -->
  <div *ngIf="chessUrl" class="result-section">
    <h3>✅ Processing Complete!</h3>
    <div class="chess-url-container">
      <p><strong>Chess Position URL:</strong></p>
      <div class="url-display">
        <input type="text" [value]="chessUrl" readonly class="url-input">
      </div>
      <div class="url-actions">
        <button (click)="openChessUrl()" class="action-btn open-btn">
          🔗 Open in New Tab
        </button>
        <button (click)="copyChessUrl()" class="action-btn copy-btn">
          📋 Copy URL
        </button>
      </div>
    </div>
  </div>
</div>
